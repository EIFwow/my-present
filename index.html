<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>초특급 선물 도착!</title>
    <style>
        /* 글자는 똑바로 나오게 설정 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        h1 { color: #2d3436; margin-bottom: 10px; }
        p { color: #636e72; margin-bottom: 30px; }

        /* 도망가는 버튼 스타일 */
        #runaway-btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: absolute; /* 자유롭게 움직이려면 필수! */
            transition: 0.1s ease-out; /* 도망가는 속도감 (낮을수록 빠름) */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>🎁 특별한 선물이 도착했습니다!</h1>
    <p>아래의 '선물 받기' 버튼을 눌러 확인해 보세요.</p>
    
    <button id="runaway-btn" style="top: 60%; left: 50%; transform: translate(-50%, -50%);">
        선물 받기
    </button>

    <script>
        const btn = document.getElementById('runaway-btn');

        // 마우스가 버튼 위에 올라오면(hover) 즉시 도망가기
        btn.addEventListener('mouseover', () => {
            // 브라우저 화면의 너비와 높이에서 버튼 크기를 뺀 만큼만 움직이게 계산
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            
            // 위치 업데이트
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.style.transform = 'none'; // 처음에 중앙 정렬했던 transform 제거
        });

        // 만약 광클로 클릭에 성공했을 때
        btn.addEventListener('click', () => {
            alert('헐... 이걸 클릭하시네? 대단하다!');
            alert('근데 사실 선물은 준비 안 했어. 미안!');
        });
    </script>
</body>
</html>
